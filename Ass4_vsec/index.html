<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Registration Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        

        <h1>Employee Registration</h1>
        <p class="subtitle">Enter employee details below</p>

        <form id="employeeForm">

            <!-- Employee Name -->
            <div class="form-group">
                <label for="name">Employee Name:</label>
                <input type="text" id="name" placeholder="Enter employee name">
                <span id="nameError" class="error"></span>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="text" id="email" placeholder="Enter email address">
                <span id="emailError" class="error"></span>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter password">
                <span id="passwordError" class="error"></span>
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="text" id="phone" placeholder="Enter 10-digit phone number">
                <span id="phoneError" class="error"></span>
            </div>

            <!-- Department -->
            <div class="form-group">
                <label for="department">Department:</label>

                <select id="department">
                    <option value="">-- Select Department --</option>
                    <option value="HR">Human Resources</option>
                    <option value="IT">Information Technology</option>
                    <option value="Finance">Finance</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Sales">Sales</option>
                </select>

                <span id="departmentError" class="error"></span>
            </div>

            <!-- Submit Button -->
            <button type="submit">Register Employee</button>

            <!-- Success Message -->
            <p id="successMessage"></p>

        </form>

    </div>

    <script src="script.js"></script>

</body>
</html>
